<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>CU7100 Ambilight</title>
<style>body{background:#131720;color:#fff;font:32px sans-serif;margin:7%}input{font:inherit;width:14em}button{font:inherit;padding:.45em .9em;margin-right:.5em}button:focus{outline:6px solid #95c9ff}pre{font:24px monospace;white-space:pre-wrap}</style>
<h1>CU7100 Ambilight</h1><p id="status">Подключение к службе…</p>
<p><label>IPv4 приёмника <input id="receiver" type="text" inputmode="decimal" autocomplete="off"></label></p>
<button id="start">Запустить</button><button id="stop">Остановить</button><pre id="details"></pre>
<script>
var field = document.getElementById('receiver');
try { field.value = localStorage.getItem('cu7100.receiver') || ''; } catch (e) {}
var startWhenReady = true;
var serviceHost = '127.0.0.1';

var replyPort;
var startedByUser = false;
var lastDiagnostic = '';
var portError = '';

function announce(code) {
    if (!startedByUser || lastDiagnostic === code) return;
    var ip = field.value.trim();
    if (!/^(?:10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.)/.test(ip) ||
        !/^\d{1,3}(?:\.\d{1,3}){3}$/.test(ip) ||
        ip.split('.').some(function (part) { return Number(part) > 255; })) return;
    lastDiagnostic = code;
    try {
        var ping = new XMLHttpRequest();
        ping.open('POST', 'http://' + ip + ':26470/cu7100-ui/' + code);
        ping.timeout = 1500;
        ping.send();
    } catch (error) { /* Diagnostics are optional on restricted web runtimes. */ }
}
function showResult(action, code, data) {
    if (code !== 200) {
        document.getElementById('details').textContent = code === 400 ? 'Введи локальный IPv4-адрес сервера.' : 'Ошибка ' + code;
        return;
    }
    if (action === 'start') {
        try { localStorage.setItem('cu7100.receiver', field.value.trim()); } catch (e) {}
    }
    document.getElementById('status').textContent = data.state;
    document.getElementById('details').textContent = data.detail;
    if (action === 'status' && startWhenReady && field.value) {
        startWhenReady = false;
        request('start');
    }
}

function nativeRequest(action) {
    try {
        if (!replyPort) {
            var local = tizen.messageport.requestTrustedLocalMessagePort('CU7100_UI_V3');
            local.addMessagePortListener(function (items) {
                items.forEach(function (item) {
                    if (item.key !== 'result') return;
                    var result = JSON.parse(item.value);
                    lastPortResponse = Date.now();
                    announce('native-reply');
                    showResult(result.action, result.code, result);
                });
            });
            replyPort = local;
        }
        var serviceId = tizen.application.getCurrentApplication().appInfo.packageId + '.StandaloneService';
        var remote = tizen.messageport.requestTrustedRemoteMessagePort(serviceId, 'CU7100_CAPTURE_V3');
        remote.sendMessage([{key: 'action', value: action}, {key: 'receiver', value: field.value.trim()}], replyPort);
        return true;
    } catch (error) {
        portError = error.name || 'Error';
        return false;
    }
}
var lastPortResponse = 0;
function readReceiver() {
    if (field.value) return;
    var socket = new WebSocket('ws://127.0.0.1:8086');
    var timer = setTimeout(function () { socket.close(); }, 3500);
    socket.onopen = function () {
        socket.send(JSON.stringify({event: 1, key: 'rpcServer'}));
    };
    socket.onmessage = function (msg) {
        try {
            var setting = JSON.parse(msg.data);
            if (!setting.error && setting.key === 'rpcServer' && !field.value) {
                var configured = new URL(setting.value);
                if (configured.protocol === 'ws:' || configured.protocol === 'wss:') {
                    field.value = configured.hostname;
                }
            }
        } finally { socket.close(); }
    };
    socket.onclose = function () { clearTimeout(timer); };
}
try { readReceiver(); } catch (error) { /* The receiver can also be entered manually. */ }
function request(action) {
    var sent = Date.now();
    if (nativeRequest(action)) {
        setTimeout(function () {
            if (lastPortResponse < sent) {
                announce('native-timeout');
                document.getElementById('details').textContent = 'Tizen передал команду. Ответа службы пока нет.';
            }
        }, 1800);
        return;
    }
    httpRequest(action);
}
function httpRequest(action, alternate) {
    var xhr = new XMLHttpRequest();
    var host = alternate ? (serviceHost === 'localhost' ? '127.0.0.1' : 'localhost') : serviceHost;
    xhr.open(action === 'status' ? 'GET' : 'POST', 'http://' + host + ':28663/' + action);
    if (action !== 'status') xhr.setRequestHeader('X-Ambilight', '1');
    if (action === 'start') xhr.setRequestHeader('X-Receiver', field.value.trim());
    xhr.timeout = 1800;
    xhr.onload = function () {
        serviceHost = host;
        announce('http-reply');
        showResult(action, xhr.status, xhr.status === 200 ? JSON.parse(xhr.responseText) : {});
    };
    xhr.ontimeout = xhr.onerror = function () {
        if (action === 'status' && !alternate) { httpRequest(action, true); return; }
        announce(portError === 'NotFoundError' ? 'native-port-missing' :
            portError === 'InvalidAccessError' || portError === 'SecurityError' ? 'native-access-denied' :
            portError === 'ReferenceError' || portError === 'TypeError' ? 'native-api-unavailable' : 'native-error');
        document.getElementById('status').textContent = 'Служба захвата недоступна';
        document.getElementById('details').textContent = 'Tizen MessagePort: ' + portError;
    };
    xhr.send();
}
document.getElementById('start').onclick = function () { startedByUser = true; lastDiagnostic = ''; announce('start-clicked'); startWhenReady = false; request('start'); };
document.getElementById('stop').onclick = function () { startWhenReady = false; request('stop'); };
document.onkeydown = function (e) {
    if (e.keyCode === 38) { field.focus(); return; }
    if (e.keyCode === 40 || (e.keyCode === 13 && document.activeElement === field)) {
        document.getElementById('start').focus(); return;
    }
    if (document.activeElement !== field && (e.keyCode === 37 || e.keyCode === 39)) {
        document.getElementById(e.keyCode === 37 ? 'start' : 'stop').focus();
    }
};
request('status');
setInterval(function () { request('status'); }, 2500);
</script></html>
